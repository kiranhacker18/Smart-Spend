<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpend - Authentication</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --border-color: #334155;
            --error-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        button.btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            background: linear-gradient(135deg, #3b82f6, #4f46e5);
            color: white;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        button.btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        button.btn:active {
            transform: scale(0.98);
        }

        .toggle-link {
            color: var(--accent-blue);
            cursor: pointer;
            text-decoration: underline;
            margin-top: 20px;
            display: inline-block;
            font-size: 0.9rem;
            background: none;
            border: none;
            font-family: inherit;
        }

        .error-message {
            color: var(--error-color);
            margin-bottom: 15px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>SmartSpend</h1>
        <p class="subtitle" id="auth-subtitle">Login to your account</p>

        <div class="error-message" id="error-msg"></div>

        <form id="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn" id="submit-btn">Login</button>
        </form>

        <button class="toggle-link" id="toggle-btn" onclick="toggleMode()">Don't have an account? Sign up</button>
    </div>

    <script>
        let isLoginMode = true;

        if (localStorage.getItem('userId')) {
            window.location.href = '/';
        }

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-subtitle').innerText = isLoginMode ? 'Login to your account' : 'Create a new account';
            document.getElementById('submit-btn').innerText = isLoginMode ? 'Login' : 'Sign Up';
            document.getElementById('toggle-btn').innerText = isLoginMode ? "Don't have an account? Sign up" : "Already have an account? Login";
            document.getElementById('error-msg').innerText = '';
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            errorMsg.innerText = '';
            
            const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/signup';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('username', data.username);
                    window.location.href = '/';
                } else {
                    errorMsg.innerText = data.message || 'Authentication failed';
                }
            } catch (err) {
                errorMsg.innerText = 'Server connection failed';
            }
        });
    </script>
</body>
</html>
